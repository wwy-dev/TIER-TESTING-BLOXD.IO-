background: linear-gradient(135deg, #001574 0%, #160555 50%, #04001d 100%);

<body>

<div style="background-image: linear-gradient(to bottom, #ffc4c4, #ff8e8e); 
     box-shadow: 2px 4px 8px rgb(255, 135, 135); 
     padding: 20px; 
     border-radius: 10px;

     display: flex;
     justify-content: center;
     align-items: center;
     flex-direction: column;
     width: 1000px;">
<h1>TIER (TESTER)</h1>
<input placeholder="LT3" id="entrada" type="text" style="border-radius: 100px; border-color: #d0d0d0; width: 200px; height: 25px; text-align: center; font-size: 25px;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);"><br>

<button id="boton" style="background-color: rgb(16, 134, 0); font-size: 40px; border-color: rgb(0, 0, 0); border-radius: 7px; width: 100; height: 50; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);">click</button>
<p id="resultado" style="font-size: 40px; font-weight: 700;"></p>
</div>


<div style="background-image: linear-gradient(to bottom, #7b84ff, #4778ff); 
     box-shadow: 2px 4px 8px rgb(1, 69, 172); 
     padding: 20px; 
     border-radius: 10px; 
     margin: 20px;
     display: flex;
     justify-content: center;
     align-items: center;
     flex-direction: column;
     width: 1000px;">
<h1>TIER EXACTO (TESTER)</h1>
<input placeholder="HIGH" id="entrada2" type="text" style="border-radius: 100px; border-color: #d0d0d0; width: 200px; height: 25px; text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #020202;"><br><br>
<button id="boton2" style="background-color: rgb(16, 134, 0); font-size: 40px; border-color: rgb(0, 0, 0); border-radius: 7px; width: 100; height: 50; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);">click</button>
<p id="resultado2" style="font-size: 40px; font-weight: 700;"></p>
</div>

<div style="background-image: linear-gradient(to bottom, #e07bff, #da47ff); 
     box-shadow: 2px 4px 8px rgb(144, 1, 172); 
     padding: 20px; 
     border-radius: 10px; 
     margin: 20px;
     display: flex;
     justify-content: center;
     align-items: center;
     flex-direction: column;
     width: 1000px;">
<h1>HP (FT 5)</h1>
<input placeholder="50"id="hp1" type="text"style="border-radius: 100px; border-color: #d0d0d0; width: 200px; height: 25px; text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #020202;"><br><br>
<input placeholder="50"id="hp2" type="text"style="border-radius: 100px; border-color: #d0d0d0; width: 200px; height: 25px; text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #020202;"><br><br>
<input placeholder="50"id="hp3" type="text"style="border-radius: 100px; border-color: #d0d0d0; width: 200px; height: 25px; text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #020202;"><br><br>
<input placeholder="50"id="hp4" type="text"style="border-radius: 100px; border-color: #d0d0d0; width: 200px; height: 25px; text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #020202;"><br><br>
<input placeholder="50"id="hp5" type="text"style="border-radius: 100px; border-color: #d0d0d0; width: 200px; height: 25px; text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #020202;"><br><br>
<button id="boton3"style="background-color: rgb(16, 134, 0); font-size: 40px; border-color: rgb(0, 0, 0); border-radius: 7px; width: 100; height: 50; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);">click</button>
<p id="resultado3"style="font-size: 40px; font-weight: 700;"></p>
</div>


<div style="background-image: linear-gradient(to bottom, #cbcbcc, #969696); 
     box-shadow: 2px 4px 8px rgb(0, 0, 0); 
     padding: 20px; 
     border-radius: 10px; 
     margin: 20px;
     display: flex;
     justify-content: center;
     align-items: center;
     flex-direction: column;
     width: 1000px;">
<h1>RESULTADOS</h1>
<button id="calcularFinal"style="background-color: rgb(16, 134, 0); font-size: 40px; border-color: rgb(0, 0, 0); border-radius: 7px; width: 100; height: 50; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);">click</button>
<p id="resultadoFinalTier"style="font-size: 30px; font-weight: 700;">ESPERANDO</p>
<p id="resultadoFinalAcurrate"style="font-size: 30px; font-weight: 700;">ESPERANDO</p>
<p id="resultadoFinalHP"style="font-size: 30px; font-weight: 700;">ESPERANDO</p>
<h1 id="resultadoREAL"style=" font-weight: 700;"></h1>
<h1 style=" font-weight: 700;">PROXIMAMENTE: MAS MODOS DE TEST</h1>
</div>
<footer style="font-size: 50px; color: #d0d0d0;">CREADO POR WOTUZION</footer>

<script>
let valoresTier = {
    "LT5": 3, "HT5": 5, "LT4": 7, "HT4": 9, "LT3": 11,
    "HT3": 13, "LT2": 15, "HT2": 17, "LT1": 19, "HT1": 21
};

let valoresAccurate = {
    "low": -1,
    "mid": 0,
    "high": 1
};

let diccionarioNombresTier = {
    2: "LT5 Low",   
    3: "LT5 Mid",   
    4: "LT5 High / HT5 Low",
    5: "HT5 Mid",   
    6: "HT5 High / LT4 Low",
    7: "LT4 Mid",   
    8: "LT4 High / HT4 Low",
    9: "HT4 Mid",  
    10: "HT4 High / LT3 Low",
    11: "LT3 Mid", 
    12: "LT3 High / HT3 Low",
    13: "HT3 Mid", 
    14: "HT3 High / LT2 Low", 
    15: "LT2 Mid", 
    16: "LT2 High / HT2 Low",
    17: "HT2 Mid", 
    18: "HT2 High / LT1 Low", 
    19: "LT1 Mid", 
    20: "LT1 High / HT1 Low", 
    21: "HT1 Mid", 
    22: "HT1 High"
};
let tierCalculado = false;
let tierInput = document.getElementById("entrada");
let tierBoton = document.getElementById("boton");
let tierResultado = document.getElementById("resultado");
let acurrateCalculado = false;
let acurrateInput = document.getElementById("entrada2");
let acurrateBoton = document.getElementById("boton2");
let acurrateResult = document.getElementById("resultado2");
let hpCalculado = false;
let hp1 = document.getElementById("hp1");
let hp2 = document.getElementById("hp2");
let hp3 = document.getElementById("hp3");
let hp4 = document.getElementById("hp4");
let hp5 = document.getElementById("hp5");
let botonhp = document.getElementById("boton3");
let resultadohp = document.getElementById("resultado3");
let finalBoton = document.getElementById("calcularFinal");
let resultadoFinalTier = document.getElementById("resultadoFinalTier");
let resultadoFinalAcurrate = document.getElementById("resultadoFinalAcurrate");
let resultadoFinalHP = document.getElementById("resultadoFinalHP");
let resultadoFINAL = document.getElementById("resultadoREAL");
let promedioGlobalHP = 0;
tierBoton.addEventListener("click", function() {
    if (tierInput.value === "") {
        tierResultado.innerHTML = "INGRESA UN TIER";
        tierResultado.style.color = "red"
    } else if (tierInput.value.toLowerCase() === "lt5" || tierInput.value.toLowerCase() === "lt4" || tierInput.value.toLowerCase() === "lt3" || tierInput.value.toLowerCase() === "lt2" || tierInput.value.toLowerCase() === "lt1" || 
               tierInput.value.toLowerCase() === "ht5" || tierInput.value.toLowerCase() === "ht4" || tierInput.value.toLowerCase() === "ht3" || tierInput.value.toLowerCase() === "ht2" || tierInput.value.toLowerCase() === "ht1" ) {
        tierResultado.innerHTML = tierInput.value.toUpperCase();
        tierResultado.style.color = "black";
        resultadoFinalTier.innerHTML = tierInput.value.toUpperCase();
        tierCalculado = true;
    } else {
        tierResultado.innerHTML = "NO ES UN TIER VALIDO";
        tierResultado.style.color = "red"
    }
});
acurrateBoton.addEventListener("click", function() {
    if (acurrateInput.value === "") {
        acurrateResult.innerHTML = "NO PUEDES DEJAR ESTE CAMPO VACIO";
        acurrateResult.style.color = "red"
    } else if (acurrateInput.value.toLowerCase() === "high" || acurrateInput.value.toLowerCase() === "mid" || acurrateInput.value.toLowerCase() === "low" ) {
        acurrateResult.innerHTML = acurrateInput.value.toUpperCase();
        acurrateResult.style.color = "black"
        resultadoFinalAcurrate.innerHTML = acurrateInput.value.toUpperCase();
        acurrateCalculado = true;
    } else {
        acurrateResult.innerHTML = "NO ES UN TIER EXACTO VALIDO";
        acurrateResult.style.color = "red"
    }
});
botonhp.addEventListener("click", function() {
    if (hp1.value === "" || hp2.value === "" || hp3.value === "" || hp4.value === "" || hp5.value === "" ) {
        resultadohp.innerHTML = "NO PUEDES DEJAR ESTE CAMPO VACIO"
        resultadohp.style.color = "red"
        return;
    }
    if (isNaN(hp1.value) || isNaN(hp2.value) || isNaN(hp3.value) || isNaN(hp4.value) || isNaN(hp5.value)) {
        resultadohp.innerHTML = "PON NUMEROS VALIDOS"
        resultadohp.style.color = "red"
        return;
    }
    let hpp1 = parseInt(hp1.value);
    let hpp2 = parseInt(hp2.value);
    let hpp3 = parseInt(hp3.value);
    let hpp4 = parseInt(hp4.value);
    let hpp5 = parseInt(hp5.value);
    let hpTotal = hpp1 + hpp2 + hpp3 + hpp4 + hpp5;
    
    promedioGlobalHP = hpTotal / 5;
    resultadohp.innerHTML = promedioGlobalHP + " HP";
    resultadohp.style.color = "black"
    resultadoFinalHP.innerHTML = promedioGlobalHP + " HP";
    hpCalculado = true;
});
finalBoton.addEventListener("click", function() {
    if (tierCalculado === false || acurrateCalculado === false || hpCalculado === false) {
        resultadoREAL.innerHTML = "DEBES DE LLENAR LOS CAMPOS ANTERIORES PRIMERO."
        resultadoREAL.style.color = "red"
        return;
    }

    let resultadoTier = valoresTier[tierInput.value.toUpperCase()];
    let resultadoAccurate = valoresAccurate[acurrateInput.value.toLowerCase()];
    let HPcalculada = (promedioGlobalHP);
    let TierNumero = parseInt(resultadoTier);
    let exactoNumero = parseInt(resultadoAccurate);
    let totalTier = TierNumero + exactoNumero;
    let ajusteTier = 0;
    if (promedioGlobalHP >= 95) {
        ajusteTier = -14;
    } else if (promedioGlobalHP >= 80) {
        ajusteTier = -12;
    } else if (promedioGlobalHP >= 65) {
        ajusteTier = -9;
    } else if (promedioGlobalHP >= 50) {
        ajusteTier = -6;
    } else if (promedioGlobalHP >= 30) {
        ajusteTier = -4;
    } else if (promedioGlobalHP > 10) {
        ajusteTier = -2;
    } else if (promedioGlobalHP >= -10 && promedioGlobalHP <= 10) {
        ajusteTier = 0;
    } else if (promedioGlobalHP >= -30) {
        ajusteTier = +3;
    } else if (promedioGlobalHP >= -50) {
        ajusteTier = +6;
    } else if (promedioGlobalHP >= -75) {
        ajusteTier = +9;
    } else {
        ajusteTier = +12;
    }
    let tierTotalReal = totalTier + ajusteTier;
    if (tierTotalReal < 2) tierTotalReal = 2;
    if (tierTotalReal > 22) tierTotalReal = 22;
    let nombreFinal = diccionarioNombresTier[tierTotalReal];
    resultadoFINAL.innerHTML = nombreFinal + " (" + tierTotalReal + " PUNTOS)";
    resultadoFINAL.style.color = "black";
});
</script>
</body>
</html>
