<style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #000d46 0%, #0e023b 50%, #000000 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card-container {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        input {
            border-radius: 100px;
            border: 1px solid #d0d0d0;
            width: 80%;
            max-width: 250px;
            height: 35px;
            text-align: center;
            font-size: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            color: #020202;
        }
        button {
            background-color: rgb(16, 134, 0);
            font-size: 30px;
            color: #ffffff;
            border: 1px solid rgb(0, 0, 0);
            border-radius: 7px;
            width: 150px;
            height: 50px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        p, h1 {
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="card-container" style="background-image: linear-gradient(to bottom, #000e36, #002897); box-shadow: 2px 4px 8px rgb(3, 3, 3);">
<h1 style="color: rgb(255, 208, 0);">TIER (TESTER)</h1>
<input placeholder="LT3" id="entrada" type="text" style="border-radius: 100px; border-color: #ffffff;text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #080808;
    background-image: linear-gradient(to bottom, rgb(189, 189, 189), rgb(255, 255, 255));
    border-color: #000000;"><br>

<button id="boton" style="background-image: linear-gradient(to bottom, rgb(0, 65, 25), rgb(0, 94, 31));border-color: rgb(0, 0, 0); border-radius: 7px;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5); text-shadow: 5px 2px 3px #000000;">CLICK</button>
<p id="resultado" style="font-size: 35px; font-weight: 700;"></p>
</div>


<div class="card-container" style="background-image: linear-gradient(to bottom, #00054e, #32006b); box-shadow: 2px 4px 8px rgb(0, 0, 0); border-color: #fcfafa;">
<h1 style="color: rgb(255, 208, 0);">TIER EXACTO (TESTER)</h1>
<input placeholder="HIGH" id="entrada2" type="text" style="border-radius: 100px; border-color: #ffffff;text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #080808;
    background-image: linear-gradient(to bottom, rgb(189, 189, 189), rgb(255, 255, 255));
    border-color: #000000;"><br><br>
<button id="boton2" style="background-image: linear-gradient(to bottom, rgb(0, 65, 25), rgb(0, 94, 31));border-color: rgb(0, 0, 0); border-radius: 7px;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5); text-shadow: 5px 2px 3px #000000;">CLICK</button>
<p id="resultado2" style="font-size: 35px; font-weight: 700; color: aqua;"></p>
</div>

<div class="card-container" style="background-image: linear-gradient(to bottom, #700092, #2e003a); box-shadow: 2px 4px 8px rgb(0, 0, 0);">
<h1  style="color: rgb(255, 208, 0);">HP (FT 5)</h1>
<input placeholder="50"id="hp1" type="text"type="text" style="border-radius: 100px; border-color: #ffffff;text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #080808;
    background-image: linear-gradient(to bottom, rgb(189, 189, 189), rgb(255, 255, 255));
    border-color: #000000;"><br><br>
<input placeholder="50"id="hp2" type="text" type="text" style="border-radius: 100px; border-color: #ffffff;text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #080808;
    background-image: linear-gradient(to bottom, rgb(189, 189, 189), rgb(255, 255, 255));
    border-color: #000000;"><br><br>
<input placeholder="50"id="hp3" type="text"type="text" style="border-radius: 100px; border-color: #ffffff;text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #080808;
    background-image: linear-gradient(to bottom, rgb(189, 189, 189), rgb(255, 255, 255));
    border-color: #000000;"><br><br>
<input placeholder="50"id="hp4" type="text"type="text" style="border-radius: 100px; border-color: #ffffff;text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #080808;
    background-image: linear-gradient(to bottom, rgb(189, 189, 189), rgb(255, 255, 255));
    border-color: #000000;"><br><br>
<input placeholder="50"id="hp5" type="text"type="text" style="border-radius: 100px; border-color: #ffffff;text-align: center; font-size: 25;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);     font-size: 20px;
    align-items: center;
    color: #080808;
    background-image: linear-gradient(to bottom, rgb(189, 189, 189), rgb(255, 255, 255));
    border-color: #000000;"><br><br>
<button id="boton3"style="background-image: linear-gradient(to bottom, rgb(0, 65, 25), rgb(0, 94, 31));border-color: rgb(0, 0, 0); border-radius: 7px;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5); text-shadow: 5px 2px 3px #000000;">CLICK</button>
<p id="resultado3"style="font-size: 35px; font-weight: 700;"></p>
</div>


<div class="card-container" style="background-image: linear-gradient(to bottom, #910059, #36002d); box-shadow: 2px 4px 8px rgb(0, 0, 0);">
<h1 style="color: gold">RESULTADOS</h1>
<button id="calcularFinal"style="background-image: linear-gradient(to bottom, rgb(0, 65, 25), rgb(0, 94, 31));border-color: rgb(0, 0, 0); border-radius: 7px;box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5); text-shadow: 5px 2px 3px #000000;">CLICK</button>
<p id="resultado3"style="font-size: 35px; font-weight: 700;">
<p id="resultadoFinalTier"style="font-size: 25px; font-weight: 700;">.</p>
<p id="resultadoFinalAcurrate"style="font-size: 25px; font-weight: 700;">.</p>
<p id="resultadoFinalHP"style="font-size: 25px; font-weight: 700;">.</p>
<h1 id="resultadoREAL"style=" font-weight: 700;"></h1>
<h1 style=" font-weight: 700; font-size: 20px; color: white;">PROXIMAMENTE: MAS MODOS DE TEST</h1>
</div>
<footer style="font-size: 25px; color: #d0d0d0;">[CREADO POR WOTUZION]</footer>

<script>
let valoresTier = {
    "LT5": 3, "HT5": 5, "LT4": 7, "HT4": 9, "LT3": 11,
    "HT3": 13, "LT2": 15, "HT2": 17, "LT1": 19, "HT1": 21
};

let valoresAccurate = {
    "low": -1,
    "mid": 0,
    "high": 1
};

let diccionarioNombresTier = {
    2: "LT5 Low",   
    3: "LT5 Mid",   
    4: "LT5 High / HT5 Low",
    5: "HT5 Mid",   
    6: "HT5 High / LT4 Low",
    7: "LT4 Mid",   
    8: "LT4 High / HT4 Low",
    9: "HT4 Mid",  
    10: "HT4 High / LT3 Low",
    11: "LT3 Mid", 
    12: "LT3 High / HT3 Low",
    13: "HT3 Mid", 
    14: "HT3 High / LT2 Low", 
    15: "LT2 Mid", 
    16: "LT2 High / HT2 Low",
    17: "HT2 Mid", 
    18: "HT2 High / LT1 Low", 
    19: "LT1 Mid", 
    20: "LT1 High / HT1 Low", 
    21: "HT1 Mid", 
    22: "HT1 High"
};
let tierCalculado = false;
let tierInput = document.getElementById("entrada");
let tierBoton = document.getElementById("boton");
let tierResultado = document.getElementById("resultado");
let acurrateCalculado = false;
let acurrateInput = document.getElementById("entrada2");
let acurrateBoton = document.getElementById("boton2");
let acurrateResult = document.getElementById("resultado2");
let hpCalculado = false;
let hp1 = document.getElementById("hp1");
let hp2 = document.getElementById("hp2");
let hp3 = document.getElementById("hp3");
let hp4 = document.getElementById("hp4");
let hp5 = document.getElementById("hp5");
let botonhp = document.getElementById("boton3");
let resultadohp = document.getElementById("resultado3");
let finalBoton = document.getElementById("calcularFinal");
let resultadoFinalTier = document.getElementById("resultadoFinalTier");
let resultadoFinalAcurrate = document.getElementById("resultadoFinalAcurrate");
let resultadoFinalHP = document.getElementById("resultadoFinalHP");
let resultadoFINAL = document.getElementById("resultadoREAL");
let promedioGlobalHP = 0;
tierBoton.addEventListener("click", function() {
    if (tierInput.value === "") {
        tierResultado.innerHTML = "INGRESA UN TIER";
        tierResultado.style.color = "red"
    } else if (tierInput.value.toLowerCase() === "lt5" || tierInput.value.toLowerCase() === "lt4" || tierInput.value.toLowerCase() === "lt3" || tierInput.value.toLowerCase() === "lt2" || tierInput.value.toLowerCase() === "lt1" || 
               tierInput.value.toLowerCase() === "ht5" || tierInput.value.toLowerCase() === "ht4" || tierInput.value.toLowerCase() === "ht3" || tierInput.value.toLowerCase() === "ht2" || tierInput.value.toLowerCase() === "ht1" ) {
        tierResultado.innerHTML = tierInput.value.toUpperCase();
        tierResultado.style.color = "cyan";
        resultadoFinalTier.innerHTML = tierInput.value.toUpperCase();
        resultadoFinalTier.style.color = "cyan"
        tierCalculado = true;
    } else {
        tierResultado.innerHTML = "NO ES UN TIER VALIDO";
        tierResultado.style.color = "red"
    }
});
acurrateBoton.addEventListener("click", function() {
    if (acurrateInput.value === "") {
        acurrateResult.innerHTML = "NO PUEDES DEJAR ESTE CAMPO VACIO";
        acurrateResult.style.color = "red"
    } else if (acurrateInput.value.toLowerCase() === "high" || acurrateInput.value.toLowerCase() === "mid" || acurrateInput.value.toLowerCase() === "low" ) {
        acurrateResult.innerHTML = acurrateInput.value.toUpperCase();
        acurrateResult.style.color = "cyan"
        resultadoFinalAcurrate.innerHTML = acurrateInput.value.toUpperCase();
        resultadoFinalAcurrate.style.color = "cyan"
        acurrateCalculado = true;
    } else {
        acurrateResult.innerHTML = "NO ES UN TIER EXACTO VALIDO";
        acurrateResult.style.color = "red"
    }
});
botonhp.addEventListener("click", function() {
    if (hp1.value === "" || hp2.value === "" || hp3.value === "" || hp4.value === "" || hp5.value === "" ) {
        resultadohp.innerHTML = "NO PUEDES DEJAR ESTE CAMPO VACIO"
        resultadohp.style.color = "red"
        return;
    }
    if (isNaN(hp1.value) || isNaN(hp2.value) || isNaN(hp3.value) || isNaN(hp4.value) || isNaN(hp5.value)) {
        resultadohp.innerHTML = "PON NUMEROS VALIDOS"
        resultadohp.style.color = "red"
        return;
    }
    let hpp1 = parseInt(hp1.value);
    let hpp2 = parseInt(hp2.value);
    let hpp3 = parseInt(hp3.value);
    let hpp4 = parseInt(hp4.value);
    let hpp5 = parseInt(hp5.value);
    let hpTotal = hpp1 + hpp2 + hpp3 + hpp4 + hpp5;
    if (hpTotal >= 501 || hpTotal <= -501) {
        resultadohp.innerHTML = "EL HP TOTAL NO PUEDE SER MAS DE 100 NI MENOS DE -100"
        resultadohp.style.color = "red"
    } else {
    
    promedioGlobalHP = hpTotal / 5;
    resultadohp.innerHTML = promedioGlobalHP + " HP";
    resultadohp.style.color = "cyan";
    resultadoFinalHP.innerHTML = promedioGlobalHP + " HP";
    resultadoFinalHP.style.color = "cyan";
    hpCalculado = true;
    }
});
finalBoton.addEventListener("click", function() {
    if (tierCalculado === false || acurrateCalculado === false || hpCalculado === false) {
        resultadoREAL.innerHTML = "DEBES DE LLENAR LOS CAMPOS ANTERIORES PRIMERO."
        resultadoREAL.style.color = "red"
        return;
    }

    let resultadoTier = valoresTier[tierInput.value.toUpperCase()];
    let resultadoAccurate = valoresAccurate[acurrateInput.value.toLowerCase()];
    let HPcalculada = (promedioGlobalHP);
    let TierNumero = parseInt(resultadoTier);
    let exactoNumero = parseInt(resultadoAccurate);
    let totalTier = TierNumero + exactoNumero;
    let ajusteTier = 0;
    if (promedioGlobalHP >= 95) {
        ajusteTier = -14;
    } else if (promedioGlobalHP >= 80) {
        ajusteTier = -12;
    } else if (promedioGlobalHP >= 65) {
        ajusteTier = -9;
    } else if (promedioGlobalHP >= 50) {
        ajusteTier = -6;
    } else if (promedioGlobalHP >= 30) {
        ajusteTier = -4;
    } else if (promedioGlobalHP > 10) {
        ajusteTier = -2;
    } else if (promedioGlobalHP >= -10 && promedioGlobalHP <= 10) {
        ajusteTier = 0;
    } else if (promedioGlobalHP >= -30) {
        ajusteTier = +3;
    } else if (promedioGlobalHP >= -50) {
        ajusteTier = +6;
    } else if (promedioGlobalHP >= -75) {
        ajusteTier = +9;
    } else {
        ajusteTier = +12;
    }
    let tierTotalReal = totalTier + ajusteTier;
    if (tierTotalReal < 2) tierTotalReal = 2;
    if (tierTotalReal > 22) tierTotalReal = 22;
    let nombreFinal = diccionarioNombresTier[tierTotalReal];
    resultadoFINAL.innerHTML = nombreFinal + " (" + tierTotalReal + " PUNTOS)";
    resultadoFINAL.style.color = "gold";
});
</script>
</body>
</html>
